name: Build and deploy Node.js app to Azure Web App - flip-7

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: node-app
          path: deployment

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_315CF083D73B42ACA33FF5C49A9ABC1F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_88328DCDF2044C9DB172E1C903C3BD99 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_56C9787E03F145BDBA9701AA26EC8762 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: flip-7
          slot-name: Production
          package: deployment
